[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capable-toolkit"
version = "0.1.0"
description = "High-level, programmatic toolkit for steering, optimizing, and experimenting with open-weight models."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Capable Toolkit Contributors" }]
keywords = [
    "llm", "machine-learning", "transformers", "fine-tuning", "activation-steering",
    "model-merge", "distillation", "watermarking", "pruning", "red-teaming",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
hf = ["transformers>=4.40", "huggingface-hub>=0.23", "safetensors>=0.4"]
vision = ["Pillow>=9.0"]
dev = ["pytest>=7.0", "pytest-cov"]
all = [
    "torch>=2.0",
    "transformers>=4.40",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/weightix-labs/capable-toolkit"
Repository = "https://github.com/weightix-labs/capable-toolkit"
Issues = "https://github.com/weightix-labs/capable-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
